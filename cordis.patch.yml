# dsh-git-graph — a Git commit graph for the right sidebar.
#
# One host row registers the API routes used by the browser half and the
# read-only `git_graph` agent tool; the package's `dsh.client` declaration makes
# the Web UI load `./lib/client.js`, which contributes the `git-graph` tab type
# and its guide card in the right sidebar.
#
# Config: `lib/settings.js` accepts the whole upstream vscode-git-graph v1.30.0
# surface — all 110 keys without the `git-graph.` prefix (e.g.
# `repository.commits.initialLoad`, `graph.style`, `keyboardShortcut.find`) —
# plus the host keys `repoPath` / `maxCommits` and the DSH extensions
# `showEmoji` / `issueUrlTemplate` / `globalShortcuts`. See
# `docs/settings-parity.md` for the per-key disposition.
#
# The values below are the legacy short spellings this bundle has always
# shipped; `lib/settings.js` folds them into their canonical keys, so existing
# installs keep working. They are all defaults — edit or delete them freely.
- insert:
    - id: dsh-git-graph
      name: dsh-git-graph
      config:
        repoPath: ""
        showRemoteBranches: true
        showStashes: true
        graphStyle: rounded
        graphColours: []
        showSignature: false
        showEmoji: true
        issueUrlTemplate: ""
        useMailmap: false
        maxDepthOfRepoSearch: 1
